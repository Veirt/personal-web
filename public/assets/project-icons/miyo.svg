<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
    .sparkle--small { animation-delay: .45s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(.78) rotate(-8deg); opacity: .55; }
      50% { transform: scale(1.08) rotate(8deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
  </style>
  <rect x="18" y="25" width="92" height="80" rx="11" fill="#999"/>
  <rect x="27" y="34" width="74" height="62" rx="5" fill="#D0D0D0"/>
  <circle cx="82" cy="49" r="8" fill="#72A5ED"/>
  <path d="m32 86 18-22 13 14 10-11 24 24H32V86Z" fill="#777"/>
  <path d="m39 78 11-14 8 9" fill="none" stroke="#72A5ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sparkle" d="m103 15 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" fill="#BDBDBD"/>
  <path class="sparkle sparkle--small" d="m20 42 2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="#BDBDBD"/>
</svg>
