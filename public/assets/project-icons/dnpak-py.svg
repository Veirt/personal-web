<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .folder { transform-box: fill-box; transform-origin: center bottom; animation: peek 2.8s cubic-bezier(.7,0,.3,1) infinite; }
    .page { transform-box: fill-box; transform-origin: 50% 100%; animation: page 2.8s ease-in-out infinite; }
    @keyframes peek { 0%,100% { transform: translateY(0) scale(1); } 43% { transform: translateY(-4px) scale(1.03,.96); } 58% { transform: translateY(1px) scale(.98,1.03); } }
    @keyframes page { 0%,100% { transform: translateY(0) rotate(0); } 48% { transform: translateY(-4px) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
