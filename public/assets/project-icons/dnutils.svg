<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .wrench { transform-box: fill-box; transform-origin: center bottom; animation: work 2.5s cubic-bezier(.7,0,.3,1) infinite; }
