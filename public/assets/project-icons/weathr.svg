<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .cloud { transform-box: fill-box; transform-origin: center bottom; animation: float 3s ease-in-out infinite; }
    .rain { animation: fall 1.5s ease-in-out infinite; }
    .rain--two { animation-delay: .2s; }
    .rain--three { animation-delay: .4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes fall {
      0%, 100% { transform: translateY(0); opacity: .45; }
      55% { transform: translateY(4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .cloud, .rain { animation: none; } }
  </style>
  <circle cx="72" cy="42" r="23" fill="#BDBDBD"/>
  <g class="cloud">
    <path transform="translate(-11 0)" d="M22 75c0-12 10-22 22-22 5-16 17-24 32-24 14 0 25 8 30 21 12 0 21 9 21 21 0 13-10 23-23 23H44c-13 0-22-7-22-19Z" fill="#858585"/>
  </g>
  <path class="rain" d="m43 104-3 7" stroke="#858585" stroke-width="5" stroke-linecap="round"/>
  <path class="rain rain--two" d="m66 104-3 7" stroke="#858585" stroke-width="5" stroke-linecap="round"/>
  <path class="rain rain--three" d="m89 104-3 7" stroke="#858585" stroke-width="5" stroke-linecap="round"/>
</svg>
