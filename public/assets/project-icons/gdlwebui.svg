    <path d="m41 83 17-22 12 14 10-17 17 25v7H41v-7Z" fill="#999"/>
    <circle class="sun" cx="82" cy="45" r="8" fill="#72A5ED"/>
    <ellipse cx="53" cy="82" rx="3" ry="5" fill="#F2F2F2"/><ellipse cx="67" cy="82" rx="3" ry="5" fill="#F2F2F2"/>
  </g>
</svg>
