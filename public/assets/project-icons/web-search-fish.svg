<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .lens { transform-box: fill-box; transform-origin: center; animation: sweep 2.8s cubic-bezier(.7,0,.3,1) infinite; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes sweep { 0%,100% { transform: translate(0,0) rotate(0); } 48% { transform: translate(3px,-3px) rotate(7deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
