    <path d="M47 68c4 5 12 5 16 0" stroke="#F1F1F1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="bubble-b">
    <path d="M80 58c0-12 8-20 20-20h9c10 0 17 7 17 17v12c0 10-7 17-18 17h-8l-12 9V80c-5-4-8-11-8-22Z" fill="#C3C3C3"/>
