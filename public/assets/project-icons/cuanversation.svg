<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .bubble-a { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.2s cubic-bezier(.7,0,.3,1) infinite; }
    .bubble-b { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.2s cubic-bezier(.7,0,.3,1) .35s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-5px) scale(1.04,.94); } 60% { transform: translateY(1px) scale(.97,1.04); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="bubble-a">
