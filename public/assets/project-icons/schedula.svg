<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .clock { transform-box: fill-box; transform-origin: center; animation: tick 2.6s cubic-bezier(.7,0,.3,1) infinite; }
    .hand { transform-box: fill-box; transform-origin: 50% 100%; animation: hand 2.6s linear infinite; }
    @keyframes tick { 0%,100% { transform: translateY(0) scale(1); } 42% { transform: translateY(-4px) scale(1.04,.96); } 58% { transform: translateY(1px) scale(.98,1.03); } }
    @keyframes hand { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path d="M29 31v67" stroke="#777" stroke-width="5" stroke-linecap="round"/>
  <circle cx="29" cy="37" r="7" fill="#999"/>
  <circle cx="29" cy="64" r="7" fill="#BDBDBD"/>
  <circle cx="29" cy="91" r="7" fill="#777"/>
  <path d="M45 37h42M45 64h31M45 91h25" stroke="#999" stroke-width="6" stroke-linecap="round"/>
  <g class="clock">
    <circle cx="84" cy="79" r="30" fill="#888"/>
    <circle cx="84" cy="79" r="22" fill="#BDBDBD"/>
    <path d="M84 65v15l11 7" stroke="#777" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="79" r="3" fill="#777"/>
  </g>
</svg>
